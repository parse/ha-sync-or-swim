name: Validate

on: [pull_request]

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether base branch has a license
        id: base-license
        run: |
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:LICENSE"; then
            echo "ignore=" >> "$GITHUB_OUTPUT"
          else
            # HACS reads license metadata from the default branch, so a license
            # introduced by this PR is not visible to its validator until merge.
            echo "ignore=license" >> "$GITHUB_OUTPUT"
          fi
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: ${{ steps.base-license.outputs.ignore }}

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tool-versions
        run: |
          echo "python=$(awk '$1 == \"python\" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "uv=$(awk '$1 == \"uv\" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ steps.tool-versions.outputs.uv }}
          python-version: ${{ steps.tool-versions.outputs.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        # --locked fails if uv.lock is out of date with backend/pyproject.toml.
        run: uv sync --project backend --locked

      - name: Run validation script
        run: uv run --project backend --locked bash scripts/validate_python.sh

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check backend changes
        id: backend-changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^backend/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and smoke test Docker image
        if: steps.backend-changes.outputs.changed == 'true'
        run: bash scripts/validate_docker.sh
