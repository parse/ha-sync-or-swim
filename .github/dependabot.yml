version: 2
updates:
  - package-ecosystem: 'docker'
    directories:
      - 'backend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'uv'
    directory: '/backend'
    schedule:
      interval: 'weekly'
    groups:
      # One weekly PR for minor/patch bumps; major versions stay separate.
      python-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
